<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scrape Logs</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e0d" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/app.css?v=5">
<script>
  try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<section id="login">
  <form class="login-card" id="login-form">
    <img src="/favicon.svg" width="56" height="56" alt="">
    <h1>Scrape logs</h1>
    <p>Sign in to see the logs</p>
    <input type="text" name="username" value="owner" autocomplete="username" hidden>
    <input type="password" id="password" autocomplete="current-password" placeholder="Password" required>
    <button class="btn" type="submit" id="login-btn">Sign in</button>
    <div class="login-error" id="login-error" role="alert"></div>
  </form>
</section>

<aside class="sidebar" id="sidebar" aria-label="Navigation">
  <a class="side-brand" href="/">
    <img src="/favicon.svg" width="30" height="30" alt="">
    <span><b>Article ingestion</b><small>Security &amp; defense news</small></span>
  </a>
  <nav class="side-nav">
    <div class="side-label">Pages</div>
      <a class="side-link" href="/"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="6" height="8" rx="1.5"/><rect x="11" y="3" width="6" height="5" rx="1.5"/><rect x="11" y="10" width="6" height="7" rx="1.5"/><rect x="3" y="13" width="6" height="4" rx="1.5"/></svg><span>Dashboard</span></a>
      <a class="side-link" href="/logs" aria-current="page"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12M4 10h12M4 15h8"/><circle cx="16" cy="15" r="1.2"/></svg><span>Logs</span></a>
  </nav>
  <nav class="side-nav side-sections" id="side-sections">
    <div class="side-label">On this page</div>
      <a class="side-sub" href="#sec-runs">Runs</a>
      <a class="side-sub" href="#sec-run">Run details</a>
      <a class="side-sub" href="#events">Events</a>
  </nav>
  <div class="side-foot">
    <div class="side-label">Schedule</div>
    <div class="side-sched"><span>Daily scrape</span><b id="side-next"></b></div>
    <div class="side-sched muted"><span>Vercel 20:00 UTC · Kan 20:15 UTC</span></div>
  </div>
</aside>
<div class="side-scrim" id="side-scrim" hidden></div>

<div class="shell">
<header class="topbar">
  <div class="brand">
    <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
    <div>
      <div class="brand-name">Logs</div>
      <div class="brand-sub">Every step of every run, kept 30 days</div>
    </div>
  </div>
  <div class="topbar-status">
    <span class="pill" id="pill">Loading…</span>
    <span class="meta-item" id="refreshed"></span>
  </div>
  <div class="topbar-actions">
    <button class="icon-btn" id="theme-btn" type="button" title="Theme" aria-label="Switch theme"></button>
    <button class="link-btn" id="logout" type="button">Sign out</button>
  </div>
</header>

<main>
  <div class="grid">
    <section class="panel span-4 runs-panel" id="sec-runs">
      <div class="panel-head">
        <div>
          <h2>Runs</h2>
          <div class="hint" id="runs-hint">Newest first</div>
        </div>
      </div>
      <ul class="run-list" id="run-list"></ul>
    </section>

    <section class="panel span-8" id="sec-run">
      <div class="panel-head">
        <div>
          <h2 id="run-title">Run</h2>
          <div class="hint" id="run-sub"></div>
        </div>
        <label class="follow"><input type="checkbox" id="follow" checked> Follow live</label>
      </div>
      <div class="run-facts" id="run-facts"></div>
      <div class="site-chips" id="site-chips"></div>
      <form class="filters" id="filters" autocomplete="off">
        <select id="f-site" aria-label="Site"><option value="">All sites</option></select>
        <div class="seg" id="f-level" role="group" aria-label="Level">
          <button type="button" data-v="all" aria-pressed="true">All</button>
          <button type="button" data-v="warn" aria-pressed="false">Warnings + errors</button>
          <button type="button" data-v="error" aria-pressed="false">Errors</button>
        </div>
        <div class="seg" id="f-step" role="group" aria-label="Detail">
          <button type="button" data-v="all" aria-pressed="true">Everything</button>
          <button type="button" data-v="steps" aria-pressed="false">Steps only</button>
        </div>
        <input type="search" id="f-q" placeholder="Filter messages or URLs…" dir="auto" aria-label="Filter">
      </form>
      <div class="table-scroll log-scroll" id="events"></div>
      <div class="pager"><span id="events-info"></span></div>
    </section>
  </div>
</main>
</div>

<script src="/nav.js?v=5"></script>
<script src="/logs.js?v=2"></script>
</body>
</html>
