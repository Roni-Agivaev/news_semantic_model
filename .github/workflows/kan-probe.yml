# Temporary: checks whether GitHub's runners are allowed through Kan's Cloudflare.
# Each job fails if its URL doesn't return HTTP 200.
name: Kan reachability probe
on:
  push:
    paths: [".github/workflows/kan-probe.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: category
            url: https://www.kan.org.il/content/kan-news/defense/
          - name: sitemap
            url: https://www.kan.org.il/media/sitemap/news/sitemap.xml
          - name: article
            url: https://www.kan.org.il/content/kan-news/defense/1110551/
    name: kan-${{ matrix.target.name }}
    steps:
      - run: pip install -q curl-cffi==0.11.4
      - run: |
          python - <<'PY'
          import sys
          from curl_cffi import requests
          r = requests.get("${{ matrix.target.url }}", impersonate="chrome", timeout=30)
          print(r.status_code, len(r.text))
          sys.exit(0 if r.status_code == 200 else 1)
          PY
